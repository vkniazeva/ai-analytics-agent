analytics_dbt:
  outputs:
    dev:
      dbname: "{{ env_var('DB_NAME') }}"
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      pass:  "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('DBT_PORT', 5433) | as_number }}"
      schema: analytics_dbt
      threads: 4
      type: postgres
      user:  "{{ env_var('DB_USER') }}"
  target: dev
