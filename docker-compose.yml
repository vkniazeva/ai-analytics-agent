services:
  postgres:
    image: postgres:16
    container_name: ai_analytics_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  superset_db:
    image: postgres:16
    container_name: superset_db
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset_pgdata:/var/lib/postgresql/data

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - ./services/superset/docker/superset_config.py:/app/superset_config.py
      - ./services/superset/docker/superset-init.sh:/app/superset-init.sh
      - ./services/superset/assets:/app/assets
    depends_on:
      - superset_db
      - postgres
    command: >
      bash -c "
        /app/superset-init.sh &&
        superset run -h 0.0.0.0 -p 8088
      "

  ai_analytics_agent:
    build:
      context: .
      dockerfile: ai_analytics_agent/Dockerfile
    container_name: ai_analytics_agent
    environment:
      AGENT_DB_HOST: postgres
      AGENT_DB_PORT: "5432"
      AGENT_DB_NAME: ${DB_NAME}
      AGENT_DB_USER: ${DB_USER}
      AGENT_DB_PASSWORD: ${DB_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    depends_on:
      - postgres

  forecasting:
    build:
      context: .
      dockerfile: forecasting/Dockerfile
    container_name: ai_analytics_forecasting
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_ANALYTICS_API_BASE: /api/agent
        VITE_FORECASTING_API_BASE: /api/forecast
    container_name: ui

  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
      - "8088:8088"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - ui
      - ai_analytics_agent
      - forecasting
      - superset


volumes:
  pgdata:
  superset_pgdata:
